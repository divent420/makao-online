<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makao</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%82%A1%3C/text%3E%3C/svg%3E">
<style>
  :root { --felt: #0f5132; --felt2: #0b3d26; --gold: #ffd54a; --panel: #1b1f27; --line: #2c3340; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px system-ui, sans-serif; background: #12151b; color: #eee; min-height: 100vh; }
  button, input, select { font: inherit; }
  input, select { background: #0e1117; color: #eee; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  button { background: #2f6df0; color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer; }
  button.alt { background: #343b4a; }
  button.warn { background: #b3402f; }
  button:disabled { opacity: .4; cursor: default; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
  .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .bar h1 { margin: 0; font-size: 22px; flex: 1; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  h2 { margin: 0 0 10px; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: #9aa4b5; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .list > div { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .list > div:last-child { border: 0; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: #8b95a7; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 5px 4px; border-bottom: 1px solid var(--line); font-size: 14px; }
  th { color: #8b95a7; font-weight: 500; font-size: 12px; }
  .me { color: var(--gold); }
  .auth { max-width: 340px; margin: 12vh auto; display: grid; gap: 10px; }
  .err { color: #ff8a80; min-height: 18px; font-size: 13px; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #b3402f; padding: 8px 16px; border-radius: 8px; display: none; z-index: 20; }
  #chat { height: 150px; overflow-y: auto; background: #0e1117; border-radius: 6px; padding: 8px; font-size: 13px; margin-bottom: 8px; }
  #chat b { color: var(--gold); }

.season-archive{margin-top:12px;padding-top:10px;border-top:1px solid #ffffff16;display:grid;gap:7px}.season-archive>strong{font-size:10px;letter-spacing:.1em;color:#9aa4b5;text-transform:uppercase}.season-archive .muted{font-size:11px;line-height:1.4}
.season-player-summary{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px;padding:10px 12px;background:#101923;border:1px solid #ffffff12;border-radius:10px;font-size:12px;color:#aeb9c9}.season-player-summary strong{color:#f3d77b;font-size:14px}
  /* table */
  .table { background: radial-gradient(ellipse at center, var(--felt) 0%, var(--felt2) 100%); border-radius: 16px; padding: 14px; min-height: 520px; display: flex; flex-direction: column; gap: 14px; border: 1px solid #0a2c1c; }
  .opps { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .opp { background: #0006; border-radius: 10px; padding: 8px 12px; min-width: 120px; text-align: center; border: 2px solid transparent; }
  .opp.turn { border-color: var(--gold); }
  .opp.out { opacity: .4; }
  .mini { display: flex; justify-content: center; margin-top: 4px; min-height: 28px; }
  .mini i { width: 14px; height: 24px; margin-left: -6px; border-radius: 3px; background: repeating-linear-gradient(45deg, #2b4fa8, #2b4fa8 3px, #3a63c9 3px, #3a63c9 6px); border: 1px solid #fff8; display: block; }
  .mini i:first-child { margin-left: 0; }
  .center { display: flex; gap: 22px; align-items: center; justify-content: center; flex: 1; flex-wrap: wrap; }
  .card { width: 60px; height: 86px; background: #fff; color: #111; border-radius: 8px; border: 1px solid #0006; display: inline-flex; flex-direction: column; justify-content: space-between; padding: 5px 6px; font-weight: 700; font-size: 17px; line-height: 1; user-select: none; position: relative; }
  .card.red { color: #c62828; }
  .card .s { font-size: 24px; text-align: center; line-height: 1; }
  .card .r2 { transform: rotate(180deg); align-self: flex-end; }
  .card.back { background: repeating-linear-gradient(45deg, #2b4fa8, #2b4fa8 6px, #3a63c9 6px, #3a63c9 12px); border: 2px solid #fff; cursor: pointer; }
  .hand { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; padding-top: 10px; }
  .hand .card { cursor: pointer; transition: transform .1s; }
  .hand .card.dim { opacity: .45; }
  .hand .card.legal { box-shadow: 0 0 0 2px var(--gold); }
  .hand .card.sel { transform: translateY(-14px); box-shadow: 0 0 0 3px #4fc3f7; }
  .banner { text-align: center; font-weight: 600; min-height: 22px; }
  .banner span { background: #0007; padding: 4px 12px; border-radius: 20px; }
  .banner .bad { color: #ff8a80; }
  .actions { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; min-height: 40px; }
  .log { font-size: 12px; color: #cfe8d8; text-align: center; min-height: 36px; }
  .suit { font-size: 28px; }
  .pick { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .pick button { min-width: 48px; font-size: 20px; }
  .overlay { position: fixed; inset: 0; background: #000b; display: flex; align-items: center; justify-content: center; z-index: 10; }
  .overlay .panel { min-width: 280px; text-align: center; }
  .pos { color: #69f0ae; } .neg { color: #ff8a80; }
  details { margin-top: 10px; } summary { cursor: pointer; color: #9aa4b5; }
  ul.rules { margin: 8px 0 0; padding-left: 18px; font-size: 13px; color: #b9c1cf; line-height: 1.5; }

  /* Makao UI theme tokens: graphic assets can replace card/table layers independently. */
  :root { --felt:#12634b; --felt2:#073e31; --gold:#f7c95c; --panel:#171f2b; --line:#2c394a; --accent:#7c9cff; --surface:#202b3a; --text:#f4f6fb; --muted:#a6b1c2; --card-radius:12px; --table-pattern:radial-gradient(ellipse at center,var(--felt) 0%,var(--felt2) 100%); --back-pattern:repeating-linear-gradient(45deg,#243f86,#243f86 6px,#365bb0 6px,#365bb0 12px); }
  body { background:linear-gradient(145deg,#0b111a,#111b29 55%,#0b111a); color:var(--text); font-family:Inter,Roboto,system-ui,sans-serif; letter-spacing:.01em; }
  button { background:var(--accent); border-radius:12px; padding:11px 16px; font-weight:650; box-shadow:0 3px 10px #0003; transition:transform .12s,filter .12s; }
  button:active { transform:scale(.97); filter:brightness(1.12); }
  button.alt { background:#344256; } button.warn { background:#b94c50; }
  input,select { border-radius:12px; padding:11px 13px; min-height:44px; background:#101925; border-color:#354458; }
  .wrap { max-width:1120px; padding:20px; }
  .bar { min-height:58px; padding:8px 2px 16px; }
  .bar h1 { font-size:25px; letter-spacing:-.04em; }
  .panel { background:linear-gradient(155deg,#1c2838,#151e2b); border:1px solid #344255; border-radius:20px; padding:18px; box-shadow:0 12px 32px #0002; }
  h2 { color:#b7c5d9; font-size:12px; letter-spacing:.12em; }
  .grid { gap:18px; }
  .list>div { padding:12px 4px; }
  .auth { max-width:390px; margin:10vh auto; padding:26px; background:#172231; border:1px solid #354458; border-radius:24px; box-shadow:0 20px 60px #0005; }
  .table { background:var(--table-pattern); border-radius:24px; border:1px solid #ffffff26; padding:clamp(14px,3vw,28px); min-height:600px; box-shadow:inset 0 0 45px #0004,0 18px 45px #0004; }
  .card { width:clamp(52px,6.2vw,72px); height:clamp(76px,9vw,104px); border-radius:var(--card-radius); padding:6px 7px; font-size:18px; box-shadow:0 5px 12px #0004; }
  .card .s { font-size:28px; } .card.back { background:var(--back-pattern); border:3px solid #f5f2e9; }
  .hand { gap:clamp(3px,1vw,9px); padding:14px 4px 4px; }
  .hand .card { margin-top:8px; } .hand .card.sel { transform:translateY(-12px); }
  .opp { border-radius:14px; background:#071b17a8; backdrop-filter:blur(8px); padding:10px 14px; }
  .actions button { min-height:46px; }
  .banner span { padding:8px 15px; }
  .player-link { color:#dce7f7; text-decoration:underline; text-underline-offset:3px; }
  .player-link:hover { color:#fff; filter:brightness(1.2); }
  .profile-chip { display:inline-flex; align-items:center; gap:8px; padding:6px 10px; border-radius:999px; background:#ffffff12; border:1px solid #ffffff1c; color:#fff; }
  .avatar { width:42px; height:42px; display:inline-grid; place-items:center; border-radius:50%; background:linear-gradient(145deg,#455a78,#26374f); font-size:23px; flex:none; box-shadow:0 0 0 3px var(--avatar-ring,transparent); }
  .avatar.big { width:76px; height:76px; font-size:40px; }
  .settings-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .xp-track { height:10px; border-radius:99px; background:#0d1520; overflow:hidden; border:1px solid #ffffff18; }
  .xp-fill { height:100%; border-radius:99px; background:linear-gradient(90deg,#6f9cff,#72e0b2); }
  .achievement { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .achievement:last-child { border-bottom:0; }
  .achievement.locked { opacity:.48; filter:grayscale(.8); }
  .achievement-icon { width:38px; height:38px; display:grid; place-items:center; border-radius:12px; background:#ffffff12; font-size:21px; flex:none; }
  .challenge { padding:12px 0; border-bottom:1px solid var(--line); }
  .challenge:last-child { border-bottom:0; }
  .challenge-track { height:7px; border-radius:99px; background:#0d1520; overflow:hidden; margin-top:8px; }
  .challenge-track > div { height:100%; background:#72c9a5; border-radius:99px; }
  .shop-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .shop-item { display:flex; flex-direction:column; gap:9px; min-height:205px; padding:14px; border:1px solid var(--line); border-radius:16px; background:#101925; }
  .shop-item-icon { display:grid; place-items:center; min-height:72px; border-radius:12px; background:linear-gradient(135deg,#273954,#172334); font-size:38px; }
  .shop-item p { margin:0; color:var(--muted); font-size:12px; flex:1; }
  .shop-wallet { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px; border-radius:16px; background:linear-gradient(110deg,#40371d,#252b36); border:1px solid #8b7541; }
  @media(max-width:520px) { .shop-grid { grid-template-columns:1fr; } }
  .swatch { min-height:54px; border:2px solid #ffffff24; border-radius:14px; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; font-weight:650; }
  .swatch.active { outline:3px solid var(--accent); outline-offset:2px; }
  .screen-title { font-size:27px; font-weight:800; letter-spacing:-.04em; margin:8px 0 18px; }
  .bottom-nav { display:none; }
  @media(max-width:760px) {
    .wrap { padding:12px 12px 86px; }
    .bar { gap:8px; } .bar h1 { font-size:21px; }
    .grid { grid-template-columns:1fr; }
    .table { min-height:calc(100dvh - 150px); padding:12px 8px; gap:10px; border-radius:18px; }
    .opps { gap:6px; } .opp { min-width:88px; padding:7px 8px; font-size:12px; }
    .center { gap:14px; min-height:110px; }
    .hand { justify-content:center; gap:3px; }
    .hand .card { width:clamp(42px,12vw,58px); height:clamp(64px,18vw,82px); padding:4px; font-size:15px; }
    .hand .card .s { font-size:21px; }
    .actions { position:sticky; bottom:72px; z-index:3; padding:8px; border-radius:16px; background:#101925eF; backdrop-filter:blur(12px); }
    .actions button { flex:1; min-width:105px; }
    .bottom-nav { display:flex; position:fixed; z-index:8; left:10px; right:10px; bottom:10px; padding:7px; border:1px solid #ffffff22; border-radius:18px; background:#172333ed; backdrop-filter:blur(18px); justify-content:space-around; box-shadow:0 8px 30px #0006; }
    .bottom-nav button { background:transparent; box-shadow:none; padding:8px 10px; display:grid; gap:2px; justify-items:center; font-size:11px; color:#c8d3e3; }
    .bottom-nav button span:first-child { font-size:19px; }
    .settings-grid { grid-template-columns:1fr 1fr; }
    .auth { margin:7vh 12px; }
  }


  /* Compact shop layout */
  .shop-wallet { padding:10px 14px; border-radius:12px; }
  .shop-wallet>div:last-child { font-size:20px !important; }
  .shop-customize { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:12px; }
  .shop-customize>.panel { margin-top:0 !important; padding:12px; border-radius:14px; }
  .shop-customize h3 { margin:5px 0 8px; font-size:13px; }
  .shop-customize .settings-grid { grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; }
  .shop-customize .swatch { min-height:42px; padding:6px; border-radius:10px; font-size:12px; }
  .shop-customize .table { min-height:104px !important; padding:8px; border-radius:12px; }
  .shop-customize .card { width:42px; height:61px; font-size:13px; }
  .shop-customize .card .s { font-size:18px; }
  .shop-note { margin-top:10px; }
  .shop-grid { grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; }
  .shop-item { display:grid; grid-template-columns:52px minmax(0,1fr); grid-template-rows:auto auto auto; align-items:center; gap:3px 10px; min-height:0; padding:10px; border-radius:13px; }
  .shop-item-icon { grid-column:1; grid-row:1 / span 3; min-height:52px; height:52px; font-size:28px; border-radius:10px; }
  .shop-item>strong { grid-column:2; grid-row:1; font-size:13px; line-height:1.2; }
  .shop-item p { grid-column:2; grid-row:2; font-size:11px; line-height:1.3; }
  .shop-item button { grid-column:2; grid-row:3; justify-self:start; min-height:30px; padding:5px 10px; margin-top:3px; font-size:11px; border-radius:9px; }
  .shop-grid+* { margin-top:10px; }
  @media(max-width:760px) {
    .shop-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .shop-customize { grid-template-columns:1fr; }
  }
  @media(max-width:420px) {
    .shop-grid { grid-template-columns:1fr; }
    .shop-item { grid-template-columns:48px minmax(0,1fr); }
    .shop-item-icon { width:48px; height:48px; min-height:48px; }
  }


  /* Unified appearance shop: free styles and coin cosmetics share each category. */
  .shop-option { display:grid !important; grid-template-columns:42px minmax(0,1fr); grid-template-rows:1fr; align-items:center; gap:7px; padding:7px !important; min-height:68px !important; }
  .shop-visual { width:42px; height:54px; display:grid; place-items:center; border-radius:0; overflow:hidden; flex:none; }
  .shop-visual-card { border:2px solid #f5f2e9; border-radius:0!important; background:repeating-linear-gradient(45deg,#243f86,#243f86 5px,#365bb0 5px,#365bb0 10px); box-shadow:0 2px 5px #0005; }
  .shop-visual-card.premium { color:transparent; font-size:0; }
  .shop-visual-felt { height:42px; border:1px solid #ffffff55; background:radial-gradient(ellipse at center,#12634b,#073e31); box-shadow:inset 0 0 10px #0005; }
  .shop-visual-frame { height:42px; border:2px solid #d6ad4e; border-radius:50%; background:#172f25; position:relative; color:#fff; font-size:20px; }
  .shop-option-info { min-width:0; display:flex; flex-direction:column; gap:3px; }
  .shop-option-info strong { font-size:12px; line-height:1.2; }
  .shop-option-info p { font-size:10px !important; line-height:1.25; min-height:0 !important; margin:0; }
  .shop-option-info button { justify-self:start; align-self:flex-start; min-height:25px; padding:3px 7px; margin-top:2px; font-size:10px; border-radius:4px; }
  .shop-option.selected { border-color:var(--gold) !important; box-shadow:0 0 0 1px var(--gold) inset; }
  @media(max-width:760px) { .shop-option { grid-template-columns:46px minmax(0,1fr); min-height:82px !important; } .shop-visual { width:46px; height:60px; } }

  .shop-note { margin:0 0 10px; }
  .shop-section { margin-top:12px !important; padding:13px !important; }
  .shop-section h2 { margin-bottom:10px; }
  .shop-grid { grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; }
  .shop-item { min-height:0; padding:9px; gap:6px; }
  .shop-item-icon { min-height:54px; height:54px; font-size:29px; }
  .shop-item p { min-height:28px; line-height:1.3; }
  .appearance-option.selected { border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset; }
  .appearance-option button { min-height:31px; padding:6px 9px; font-size:11px; }
  .shape-grid { grid-template-columns:repeat(3,minmax(0,1fr)); margin-bottom:12px; }
  .shape-option { min-height:40px; padding:7px; }
  .shape-option.selected { outline:2px solid var(--gold); }
  .shop-preview { padding:12px; border-radius:12px; background:#0e1723; margin-bottom:10px; }
  .shop-preview .card { width:44px; height:64px; font-size:14px; border-radius:0!important; }
  .card,.shop-preview .card { border-radius:0!important; }
  .shop-preview .card .s { font-size:19px; }
  .shop-earn-note { margin-top:12px !important; padding:12px !important; }
  @media(max-width:760px) { .shop-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } .shop-option{grid-template-columns:36px minmax(0,1fr);gap:6px;padding:6px!important;min-height:64px!important}.shop-visual{width:36px;height:47px}.shop-visual-felt,.shop-visual-frame{height:36px} }
  @media(max-width:420px) { .shop-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .shape-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }


  /* Larger cards in the appearance table preview. */
  .shop-preview .preview-play-area{gap:54px;padding:18px 0 14px}
  .shop-preview .preview-pile .card{width:64px;height:92px;font-size:20px}
  .shop-preview .preview-pile .card .s{font-size:27px}
  .shop-preview .preview-hand{gap:10px;padding:12px 0 5px}
  .shop-preview .preview-hand .card{width:58px;height:84px;font-size:18px}
  .shop-preview .preview-hand .card .s{font-size:24px}
  .shop-preview .preview-pile small{font-size:10px}
  .lobby-friend-picker{margin-top:12px;padding:12px;border:1px solid #ffffff20;border-radius:14px;background:#101925}
  .lobby-online-friends{display:grid;gap:5px}
  .lobby-online-friend{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid #ffffff12}
  .lobby-online-friend .muted{font-size:11px}
  .lobby-online-friend button{min-height:34px;padding:6px 12px}
  /* Lobby rules: compact icon toggles with hover labels and clear state colors. */
  .lobby-rules { margin-top:14px; border-top:1px solid var(--line); padding-top:14px; }
  .rule-settings { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-bottom:14px; }
  .rule-setting { display:flex; flex-direction:column; gap:6px; padding:10px 12px; border:1px solid #ffffff18; border-radius:12px; background:#0e1723; color:var(--muted); font-size:12px; }
  .rule-setting select { width:100%; min-width:0; min-height:38px; padding:7px 9px; color:var(--text); font-weight:650; }
  .rule-setting strong { color:var(--text); font-size:15px; }
  .rule-button-grid { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:9px; }
  .rule-toggle { position:relative; display:grid; place-items:center; min-width:0; min-height:66px; padding:9px; border:2px solid; border-radius:14px; box-shadow:none; background:#111b28; transition:border-color .15s,background .15s,transform .15s; }
  .rule-toggle.is-on { border-color:#35c982; background:linear-gradient(145deg,#123b30,#10251f); color:#b5ffd7; }
  .rule-toggle.is-off { border-color:#df626a; background:linear-gradient(145deg,#402329,#261b24); color:#ffc0c4; }
  .rule-toggle:not(:disabled):hover { transform:translateY(-2px); filter:brightness(1.18); z-index:2; }
  .rule-toggle.read-only { cursor:default; opacity:1; }
  .rule-icon { font-size:25px; line-height:1; }
  .rule-status { position:absolute; right:6px; top:4px; font-size:17px; line-height:1; font-weight:900; }
  .rule-tooltip { position:absolute; left:50%; bottom:calc(100% + 9px); transform:translate(-50%,5px); width:max-content; max-width:min(230px,75vw); padding:8px 10px; border:1px solid #53647a; border-radius:9px; background:#080e17; color:#f4f6fb; font-size:12px; font-weight:550; line-height:1.35; text-align:center; white-space:normal; box-shadow:0 8px 24px #0008; opacity:0; visibility:hidden; pointer-events:none; transition:opacity .12s,transform .12s; }
  .rule-toggle:hover .rule-tooltip,.rule-toggle:focus-visible .rule-tooltip { opacity:1; visibility:visible; transform:translate(-50%,0); }
  @media(max-width:760px) { .rule-button-grid { grid-template-columns:repeat(4,minmax(0,1fr)); gap:7px; } .rule-toggle { min-height:60px; } }
  @media(max-width:420px) { .rule-button-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } .rule-settings { gap:7px; } }

/* Card-play motion: hand deals, selection lift, turn handoff and draw feedback. */
@keyframes makao-card-deal{0%{opacity:0;transform:translateY(28px) rotate(7deg) scale(.82);filter:brightness(1.5)}65%{opacity:1;transform:translateY(-5px) rotate(-1deg) scale(1.035)}100%{opacity:1;transform:translateY(0) rotate(0) scale(1);filter:none}}
.game-hand .card.card-dealt{animation:makao-card-deal .48s cubic-bezier(.2,.8,.25,1) both}
.game-hand .card:nth-child(2).card-dealt{animation-delay:35ms}.game-hand .card:nth-child(3).card-dealt{animation-delay:70ms}.game-hand .card:nth-child(4).card-dealt{animation-delay:105ms}.game-hand .card:nth-child(5).card-dealt{animation-delay:140ms}
@keyframes makao-turn-arrive{0%{transform:scale(.96);filter:brightness(1.35)}55%{transform:scale(1.025)}100%{transform:scale(1);filter:none}}
.game-player-card.turn{animation:makao-turn-arrive .38s ease-out both}
.game-player-card.turn:after{content:'';position:absolute;inset:-3px;border:1px solid #f0d47a66;border-radius:inherit;pointer-events:none;animation:turn-ring .85s ease-out both}
.game-player-card.turn{position:relative}
@keyframes turn-ring{0%{opacity:.8;transform:scale(.94)}100%{opacity:0;transform:scale(1.09)}}
@keyframes makao-draw-bounce{0%,100%{transform:translateY(0)}35%{transform:translateY(-7px) rotate(-2deg)}70%{transform:translateY(1px) rotate(1deg)}}
.pile-slot:has(.card.back:active) .card.back{animation:makao-draw-bounce .28s ease}
.game-actions button{transition:transform .14s ease,filter .14s ease,box-shadow .14s ease}
.game-actions button:active{transform:translateY(1px) scale(.97);filter:brightness(1.15)}
.game-hand .card{transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s ease,filter .18s ease}
.game-hand .card.sel{transform:translateY(-13px) scale(1.035);filter:brightness(1.08)}
.discard-history .card{animation:makao-history-slide .3s ease-out both}
@keyframes makao-history-slide{from{opacity:.35;transform:translateX(9px) scale(.94)}to{opacity:.98;transform:translateX(0) scale(1)}}
@media(prefers-reduced-motion:reduce){.game-hand .card.card-dealt,.game-player-card.turn,.game-player-card.turn:after,.pile-slot:has(.card.back:active) .card.back,.discard-history .card{animation:none!important}.game-hand .card,.game-actions button{transition:none!important}}

.wrap{max-width:1240px;padding:22px 24px;color:var(--text)}
.wrap.app-shell{max-width:1380px;padding:22px 30px 110px}
h1,h2,h3,h4,.screen-title,.section-heading h2{
  color:var(--text)!important;letter-spacing:-.035em;font-weight:800;
}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:#c5ced9!important}
p,.muted,.welcome-row p,.section-heading p{color:var(--muted)}
.eyebrow,.welcome-row .eyebrow{color:var(--accent-2)!important;font-weight:800;letter-spacing:.16em}
.panel,.auth,.home-section,.play-hub,.promo-card,.how-to-panel,
.game-chat-panel,.game-result-panel,.shop-item,.shop-option,.challenge,.achievement{
  background:linear-gradient(145deg,#1b222c,#141920)!important;
  border:1px solid var(--line)!important;
  border-radius:15px!important;
  color:var(--text);
  box-shadow:0 14px 34px #0005, inset 0 1px #ffffff08;
}
.panel{padding:17px}
.bar,.app-topbar,.game-header{
  background:linear-gradient(180deg,#171d26f5,#11161df5)!important;
  border:1px solid var(--line)!important;border-radius:14px;
  padding:12px 15px;box-shadow:0 10px 28px #0005;
}
.app-topbar{position:relative;z-index:2}
.brand-mark strong,.game-title-lockup strong{font-weight:950;letter-spacing:.13em;color:#fff}
.brand-mark small,.game-title-lockup small{color:#aab5c3;letter-spacing:.2em;font-weight:800}
.brand-card{
  background:linear-gradient(145deg,#ff5268,#a71935)!important;
  color:#fff!important;border:1px solid #ff8a98!important;
  box-shadow:0 0 22px #ed334f44,0 4px 10px #0007;
}
.topbar-spacer{flex:1}
.wallet-chip,.profile-chip,.level-pill{
  background:#202833!important;border:1px solid var(--line-strong)!important;
  color:var(--text)!important;border-radius:11px!important;
}
.wallet-chip strong{color:var(--gold)!important}
.profile-chip .avatar,.avatar,.game-avatar{
  background:linear-gradient(145deg,#303b49,#1a222c)!important;
  border:1px solid #69788c!important;color:#fff;
}
.profile-name{font-weight:750;color:#f3f5f8}
.back-button{min-width:38px}
button{
  background:linear-gradient(135deg,#f0445e,#bd203d)!important;
  border:1px solid #ff6579!important;border-radius:9px!important;
  color:#fff!important;font-weight:800;letter-spacing:.01em;
  box-shadow:0 5px 14px #0004, inset 0 1px #ffffff22;
  transition:transform .16s ease,filter .16s ease,box-shadow .16s ease,border-color .16s ease;
}
button:not(:disabled):hover{filter:brightness(1.12);transform:translateY(-1px);box-shadow:0 8px 20px #0006,0 0 0 2px #ed334f20}
button:not(:disabled):active{transform:translateY(0) scale(.985)}
button.alt,.leave-game-button{
  background:linear-gradient(145deg,#293341,#1b232e)!important;
  border:1px solid #435064!important;color:#dbe2eb!important;box-shadow:inset 0 1px #ffffff0b;
}
button.alt:hover,.leave-game-button:hover{border-color:#ed5268!important;color:#fff!important}
button.warn{background:linear-gradient(135deg,#a51f35,#671b2a)!important;border-color:#d94b60!important}
button:disabled{filter:saturate(.4);opacity:.42;transform:none;box-shadow:none}
input,select,textarea,.create-table-form input,.create-table-form select,.ai-controls select{
  background:#0e131a!important;color:var(--text)!important;border:1px solid #394657!important;
  border-radius:9px!important;outline:none;box-shadow:inset 0 2px 5px #0004;
}
input:focus,select:focus,textarea:focus{border-color:#ed5268!important;box-shadow:0 0 0 3px #ed334f25!important}
input::placeholder,textarea::placeholder{color:#738092!important}
table{border-collapse:separate;border-spacing:0}
td,th{border-bottom:1px solid #303b49!important;color:#d8e0e9}
th{color:#8f9cad!important;text-transform:uppercase;letter-spacing:.1em;font-size:10px}
.me{color:#ff697d!important}
#toast{background:#a91f38!important;border:1px solid #ff6579;color:#fff;box-shadow:0 12px 32px #0009}
#chat{background:#0d1219!important;border:1px solid #303b49;color:#dbe2eb}
#chat b{color:#ff7183!important}
.err,.neg,.banner .bad{color:#ff7183!important}
.pos,.ready-status.is-ready{color:#65dba0!important}

/* Home, matchmaking, lobby discovery and navigation */
.home-layout{gap:20px}
.home-main,.home-sidebar{min-width:0}
.play-hub,.home-section,.promo-card,.how-to-panel{padding:20px!important}
.section-heading{border-color:var(--line)!important}
.section-heading h2{font-size:16px}
.text-action{color:#ff7587!important}
.quick-match-button,.pass-play-button{
  background:linear-gradient(110deg,#ed334f,#9f1d38)!important;
  border:1px solid #ff7183!important;border-radius:13px!important;
  box-shadow:0 10px 25px #9d1e3933,inset 0 1px #ffffff28;
}
.quick-match-button.searching{animation:esportsPulse 1.5s ease-in-out infinite}
@keyframes esportsPulse{50%{box-shadow:0 0 0 5px #ed334f20,0 0 28px #ed334f55}}
.quick-match-icon,.option-icon,.history-result-icon{
  background:linear-gradient(145deg,#49202b,#251b23)!important;
  color:#ff788a!important;border:1px solid #854052!important;border-radius:11px!important;
}
.quick-match-copy strong,.pass-play-button strong{color:#fff}
.quick-match-copy small,.pass-play-button small{color:#c1cbd7}
.play-options{gap:12px}
.play-option-card,.create-lobby-option,.table-list-row,.history-row,.home-history-row{
  background:linear-gradient(145deg,#202833,#171d25)!important;
  border:1px solid #344152!important;border-radius:12px!important;color:var(--text);
}
.play-option-card:hover,.table-list-row:hover{border-color:#a63b50!important}
.option-copy strong,.table-list-row b{color:#f3f5f8}
.option-copy p,.empty-state{color:var(--muted)}
.option-arrow{color:#ff7587}
.create-lobby-option .create-table-form{border-color:#344152}
.create-lobby-option .lobby-privacy-check,.lobby-privacy-check{
  background:#111821!important;border:1px solid #3a4657!important;color:#dbe2eb!important;
}
.create-lobby-option .lobby-privacy-check input[type=checkbox]{accent-color:var(--accent)}
.create-table-details,.create-table-details summary{color:#dbe2eb}
.create-table-form button{min-height:40px}
.table-list-row{padding:12px 14px}
.small-action{white-space:nowrap}
.empty-state{background:#111821;border:1px dashed #3b4859;border-radius:12px;padding:18px;text-align:center}
.leaderboard-home th{color:#ff9baa!important}
.leaderboard-home tr.me{background:#3a202a}
.rank-emblem{color:var(--gold)}
.your-record,.season-player-summary{
  background:linear-gradient(120deg,#33252b,#202833)!important;border:1px solid #62404b!important;
  border-radius:12px;color:#e8edf4;
}
.your-record strong,.season-player-summary strong{color:var(--gold)!important}
.promo-card{background:radial-gradient(circle at 90% 0,#8e263d55,transparent 48%),linear-gradient(145deg,#242b36,#171c24)!important}
.promo-sparkle{color:var(--gold)}
.promo-card h3{color:#fff}
.promo-card p{color:#b6c1ce}
.promo-button{background:linear-gradient(135deg,#ed334f,#9f1d38)!important}
.how-to-panel summary{color:#ff8292;font-weight:800;cursor:pointer}
.app-bottom-nav,.bottom-nav{
  background:#10151df2!important;border:1px solid #344152!important;
  border-radius:15px!important;box-shadow:0 12px 35px #0009;backdrop-filter:blur(16px);
}
.app-bottom-nav button,.bottom-nav button{
  background:transparent!important;border:1px solid transparent!important;
  color:#8f9cad!important;box-shadow:none!important;
}
.app-bottom-nav button span:first-child{font-size:19px}
.app-bottom-nav button.active{
  background:linear-gradient(145deg,#48212c,#2b1b23)!important;
  border-color:#854052!important;color:#ff8494!important;
}
.app-bottom-nav button:not(:disabled):hover{background:#222b37!important;color:#fff!important;transform:none}

/* Lobby, player slots, ready states, rules and social */
.lobby-member-row,.lobby-online-friend,.lobby-friend-picker{
  background:#141b24!important;border-color:#344152!important;color:var(--text);
}
.lobby-member-name{color:#fff!important}
.ready-status{color:#9aa6b5}
.ready-status.is-ready{font-weight:900}
.lobby-rules,.rule-settings,.rule-setting{border-color:#344152!important}
.rule-setting{background:#151c25!important;border-radius:10px}
.rule-setting strong{color:#e8edf4}
.rule-setting select{background:#0e131a!important}
.rule-toggle{background:#202a36!important;border:1px solid #405066!important;color:#dce4ee!important}
.rule-toggle.is-on{background:#173c32!important;border-color:#348b69!important;color:#8ce5b7!important}
.rule-toggle.is-off{background:#202630!important;color:#9aa6b5!important}
.rule-toggle.read-only{opacity:.8}
.rule-tooltip{background:#080c12!important;border:1px solid #455365!important;color:#fff!important}
.lobby-online-friend{border-top:1px solid #344152!important}
.player-link{color:#ff9baa!important}
.player-link:hover{color:#fff!important}
.profile-chip:hover{border-color:#ed5268!important}

/* Competitive table: dark arena, clear player focus and strong action hierarchy */
.game-screen{gap:14px}
.game-header{margin-bottom:12px}
.game-title-lockup strong{font-size:19px}
.game-title-lockup small{font-size:9px}
.game-timer{
  background:#251d25!important;border:1px solid #8e394b!important;border-radius:10px!important;
  color:#ff9baa!important;font-weight:900;box-shadow:0 0 20px #ed334f1a;
}
.game-timer.timer-warning{border-color:#d69a48!important;color:#ffd28b!important}
.game-timer.timer-critical{background:#521d2a!important;border-color:#ff5268!important;color:#fff!important}
.game-table-frame{
  background:linear-gradient(145deg,#1b222c,#0e131a)!important;
  border:1px solid #465365!important;border-radius:22px!important;
  box-shadow:0 24px 65px #0009,inset 0 1px #ffffff0a;
  padding:12px;
}
.game-table-felt,.table{
  background:
    radial-gradient(ellipse at 50% 42%,#2b3542 0,#1d2733 48%,#141c26 100%)!important;
  border:1px solid #536174!important;border-radius:16px!important;
  box-shadow:inset 0 0 0 5px #0c111888,inset 0 0 55px #05080c88;
}
.game-opponents,.opps{gap:10px}
.game-player-card,.opp{
  background:linear-gradient(145deg,#222c38,#151c25)!important;
  border:1px solid #3d4a5b!important;border-radius:12px!important;
  color:#e9eef5;box-shadow:0 7px 18px #0005;
}
.game-player-card.turn,.opp.turn{
  border:1px solid #ff667b!important;
  box-shadow:0 0 0 2px #ed334f38,0 0 24px #ed334f3d!important;
  background:linear-gradient(145deg,#3a202b,#20232d)!important;
}
.game-player-card.out,.opp.out{filter:grayscale(.8);opacity:.45}
.game-avatar{border-color:#64758b!important}
.game-player-details strong{color:#fff}
.game-player-details small{color:#aab6c5}
.game-player-card .mini i,.mini i{
  background:var(--back-pattern)!important;border:1px solid #e47b8b!important;
  border-radius:3px!important;box-shadow:0 2px 5px #0008;
}
.game-status-banner,.banner{color:#dce4ee}
.game-status-banner span,.banner span{
  background:#111923!important;border:1px solid #3d4a5b!important;
  border-radius:8px!important;padding:6px 12px;
}
.game-status-banner .bad{color:#ff788a}
.game-center-piles{gap:24px}
.pile-slot{background:#11192388;border:1px solid #3c4a5c;border-radius:12px;padding:10px}
.pile-slot small{color:#98a6b7;letter-spacing:.13em;font-weight:800}
.pile-slot strong{color:#f1f4f8}
.discard-display,.discard-history{gap:6px}
.discard-history .card{box-shadow:0 5px 12px #0008}
.game-log,.log{color:#aebbc9}
.game-actions button{min-height:42px;padding:9px 17px}
.game-actions button:disabled{opacity:.35}
.your-hand-label{color:#ff9baa!important;font-weight:900;letter-spacing:.13em}
.own-player-bar{
  background:linear-gradient(110deg,#222b37,#151c25)!important;
  border:1px solid #435166!important;border-radius:13px!important;
  color:#f3f5f8;box-shadow:0 8px 22px #0005;
}
.own-game-avatar{border:1px solid #75859a}
.own-player-copy strong{color:#fff}
.own-player-copy small{color:#a6b2c0}
.own-hand-count{background:#3c202b!important;color:#ff9baa!important;border:1px solid #854052!important;border-radius:8px}
.game-chat-panel #chat{border-radius:10px}
.makao-call{background:#141b24;border:1px solid #3d4a5b;border-radius:12px;padding:10px}

/* Fresh playing-card face and back — preserve cardEl markup and all card semantics */
.card{
  width:64px!important;height:92px!important;
  background:linear-gradient(155deg,#fff 0%,#f2f4f7 58%,#e3e8ef 100%)!important;
  color:#151b24!important;border:1px solid #c7ced8!important;
  border-radius:5px!important;padding:6px!important;
  box-shadow:0 5px 12px #0006, inset 0 0 0 2px #ffffffaa!important;
  font-family:Georgia,"Times New Roman",serif;
  font-weight:900;line-height:1;overflow:hidden;
}
.card.red{color:#c92342!important}
.card:not(.red){color:#17202b!important}
.card .s{
  font-size:29px!important;line-height:1!important;
  text-shadow:0 1px #fff8;
}
.card .card-corner{
  display:flex;flex-direction:column;align-items:center;gap:1px;
  font-size:15px;line-height:.9;z-index:1;
}
.card .card-corner span{font-size:11px}
.card .card-corner-br{transform:rotate(180deg);align-self:flex-end}
.card.back{
  background:var(--back-pattern)!important;
  border:2px solid #f2c1c9!important;border-radius:5px!important;
  box-shadow:0 5px 13px #0008,inset 0 0 0 3px #35131e,inset 0 0 0 5px #d96b7d!important;
}
.card.back:after{
  content:var(--back-mark,"M");position:absolute;inset:20% 15%;
  display:grid;place-items:center;border:1px solid #f3b2bd88;
  color:#ffe1e5;font:900 25px Georgia,serif;text-shadow:0 2px 5px #0008;
  pointer-events:none;
}
.game-hand .card,.hand .card{transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}
.game-hand .card:not(.dim):hover,.hand .card:not(.dim):hover{transform:translateY(-7px) rotate(-1deg);filter:brightness(1.04)}
.game-hand .card.sel,.hand .card.sel{
  transform:translateY(-14px)!important;
  box-shadow:0 0 0 2px #ff5268,0 10px 22px #0009!important;
}
.game-hand .card.legal,.hand .card.legal{box-shadow:0 0 0 2px #65dba0,0 0 16px #65dba044!important}
.game-hand .card.dim,.hand .card.dim{filter:grayscale(.55);opacity:.48}
.card-arrive{filter:drop-shadow(0 0 12px #ff526866)}
.shop-preview,.preview-play-area{background:#111923!important;border:1px solid #3b4859!important;border-radius:13px}
.shop-preview .card,.preview-hand .card,.preview-pile .card{box-shadow:0 5px 14px #0008!important}

/* Shop, customization and card/table previews */
.shop-wallet{background:linear-gradient(110deg,#33242b,#1a222d)!important;border:1px solid #6c3a49!important}
.shop-wallet strong,.shop-wallet>div:last-child{color:var(--gold)!important}
.shop-section,.shop-preview-section,.shop-earn-note,.shop-note{
  background:linear-gradient(145deg,#1c232d,#141a22)!important;border-color:#344152!important;
}
.shop-section h2{color:#f4f6fa!important}
.shop-item,.shop-option,.appearance-option,.shape-option{
  background:linear-gradient(145deg,#202a36,#171e27)!important;
  border:1px solid #354355!important;border-radius:12px!important;color:#f2f5f8!important;
}
.shop-item:hover,.shop-option:hover,.appearance-option:hover,.shape-option:hover{border-color:#a74458!important}
.shop-option.selected,.appearance-option.selected,.shape-option.selected{
  border-color:#ff5268!important;box-shadow:0 0 0 1px #ff5268 inset,0 0 18px #ed334f20!important;
}
.shop-option-info strong,.shop-item>strong{color:#fff!important}
.shop-option-info p,.shop-item p,.shop-note,.shop-earn-note{color:#9eabb9!important}
.shop-option-info button,.shop-item button,.shop-option-button{
  background:linear-gradient(135deg,#ed334f,#9f1d38)!important;border-color:#ff6579!important;color:#fff!important;
}
.shop-visual-card{border-radius:7px!important;box-shadow:0 8px 20px #0008}
.shop-visual-felt{background:radial-gradient(ellipse,#2b3542,#121922);border:1px solid #536174!important}
.shop-visual-frame{border-color:#64758b}
.shop-preview-section .shop-preview{box-shadow:inset 0 0 30px #0008}
.swatch.active{outline:2px solid #ff5268!important;outline-offset:2px}
.shop-wallet .muted{color:#aab6c5!important}
.xp-track,.challenge-track{background:#0e141c!important;border:1px solid #354355!important;border-radius:99px}
.xp-fill,.challenge-track>div{background:linear-gradient(90deg,#a91f3c,#ff5268)!important;border-radius:99px}
.challenge,.achievement{background:linear-gradient(145deg,#202a36,#171e27)!important}
.achievement-icon{background:#38222c!important;color:#ff8494!important;border:1px solid #754052;border-radius:10px}
.achievement.locked{filter:saturate(.4);opacity:.65}
.profile-screen,.profile-content{color:var(--text)}
.avatar.big{background:linear-gradient(145deg,#3b2530,#202a36)!important;border:2px solid #ed5268!important;box-shadow:0 0 25px #ed334f25}

/* Results, history, replay, moderation and connection states */
.postgame-panel{background:linear-gradient(145deg,#252d39,#171e27)!important;border:1px solid #526176!important}
.postgame-title{color:#ff8797!important}
.results-score-row{background:#1a222c!important;border:1px solid #354355!important}
.results-score-row.results-winner{background:linear-gradient(90deg,#46212d,#202833)!important;border-color:#ed5268!important}
.results-place{color:var(--gold)!important}
.results-player strong,.results-rating strong{color:#fff!important}
.results-player small,.results-rating small{color:#9eabb9!important}
.postgame-chat{border-color:#354355!important}
.lobby-session-leaderboard,.session-score-head,.session-score-row{border-color:#354355!important}
.session-score-leader{background:#43232e!important}
.game-history-panel,.history-row,.replay-summary,.replay-player,.replay-move{
  background:#171f29!important;border-color:#354355!important;color:#e9eef5;
}
.replay-progress{background:#0c1219!important}
.replay-progress>div{background:linear-gradient(90deg,#a91f3c,#ff5268)!important}
.replay-active,.replay-move.selected{background:#46212d!important;border-color:#ed5268!important}
.replay-discard .card{box-shadow:0 4px 12px #0008}
.connection-banner{background:#18232b!important;border:1px solid #477b68!important;color:#b6f0d1!important}
.connection-banner .connection-dot{background:#65dba0!important}
.connection-banner.restored{border-color:#477b68!important}
.player-disconnect-notice{background:#2a2028!important;border-color:#854052!important;color:#f4e8ec!important}
.disconnect-status-dot{background:#ff5268!important}
.disconnect-countdown{color:#ff9baa!important}
.admin-players-panel,.admin-reports-panel{background:#171f29!important;border-color:#354355!important}
.overlay{background:#05080dcc!important;backdrop-filter:blur(8px)}
.overlay .panel{background:#1b232e!important;border:1px solid #465365!important}

/* Auth and compact secondary pages */
.auth{
  max-width:410px!important;margin:10vh auto!important;padding:28px!important;
  background:linear-gradient(145deg,#1d2530,#121820)!important;
  border:1px solid #3b4859!important;border-radius:18px!important;
  box-shadow:0 24px 70px #0009!important;
}
.auth h1{color:#fff!important}
.auth .row{gap:10px}
.screen-title{font-size:25px;font-weight:900;margin:18px 0}
.settings-grid{gap:10px}
.settings-grid>.panel{text-align:center}
.season-archive{border-color:#354355!important}
.season-archive>strong{color:#ff9baa!important}
.season-player-summary{background:#1b2530!important;border-color:#3b4859!important}
.rule-settings label,.rule-setting{color:#dbe2eb}
#chat,.game-chat-panel input{border-color:#354355!important}

/* Responsive polish: retain compact touch targets and readable cards */
@media(max-width:900px){
  .wrap.app-shell{padding:14px 14px 100px}
  .home-layout{grid-template-columns:1fr}
  .home-sidebar{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .game-table-frame{padding:8px}
  .game-table-felt{padding:12px!important}
}
@media(max-width:600px){
  .wrap,.wrap.app-shell{padding:10px 10px 94px}
  .bar,.app-topbar,.game-header{gap:8px;padding:9px}
  .brand-mark strong{font-size:14px}
  .profile-name{display:none}
  .wallet-chip{padding:7px 9px}
  .home-sidebar{display:flex;flex-direction:column}
  .play-hub,.home-section,.promo-card,.how-to-panel{padding:14px!important}
  .section-heading{gap:8px}
  .quick-match-button,.pass-play-button{min-height:66px}
  .app-bottom-nav{left:10px;right:10px;bottom:8px}
  .app-bottom-nav button{padding:7px 5px;min-width:0}
  .game-table-frame{padding:5px;border-radius:15px!important}
  .game-table-felt{padding:8px!important;min-height:0!important;border-radius:12px!important}
  .game-center-piles{gap:12px}
  .game-player-card,.opp{min-width:92px;padding:7px}
  .card{width:53px!important;height:77px!important;padding:5px!important}
  .card .s{font-size:24px!important}
  .card .card-corner{font-size:13px}
  .card .card-corner span{font-size:9px}
  .game-hand{gap:3px}
  .game-hand .card{margin-left:-2px}
  .game-actions{gap:6px}
  .game-actions button{padding:8px 11px;min-height:38px}
  .postgame-top-grid{grid-template-columns:1fr!important}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}


/* Final palette cleanup: remove remaining Graphite Ember / felt-green overrides
   from Home and the post-match lobby. These selectors intentionally win over
   older theme layers that used !important. */
:root{
  --accent:#ed334f!important;--gold:#f3bd65!important;
  --felt:#202a35!important;--felt2:#111820!important;
}

function replayScreen() {

function playSelected() {
  if (!sel.length) return;
  const r = rank(sel[sel.length - 1]);
  if (r === 'J' && S.game.rules.jack) { choose = { kind: 'demand', cards: [...sel] }; return render(); }
  if (r === 'A' && S.game.rules.ace) { choose = { kind: 'suit', cards: [...sel] }; return render(); }
  sendPlay(sel, {});
}
function sendPlay(cards, extra) {
  act({ t: 'play', cards, makao: sayMakao, ...extra }).then((r) => { if (!r.error) { sel = []; choose = null; sayMakao = false; } render(); });
}
function clickCard(c) {
  const g = S.game;
  if (!g.myTurn) return;
  if (sel.includes(c)) sel = sel.filter((x) => x !== c);
  else if (!sel.length) { if (!g.legal.includes(c)) return toast("You can't play that card now"); sel = [c]; }
  else if (g.rules.multiPlay && rank(sel[0]) === rank(c) && !g.drew && !g.pending) sel.push(c);
  else if (g.rules.multiPlay && rank(sel[0]) === rank(c) && !g.drew && g.legal.includes(c)) sel.push(c);
  else if (g.legal.includes(c)) sel = [c];
  else return toast('Pick cards of the same rank');
  render();
}

      h('button',{class:'alt',style:'margin-top:12px',onclick:()=>{dismissed=S.room.result.id;localStorage.setItem('mk_dismissed',dismissed);}},'Keep table')) : null,
    bottomNav('home')));
  if(local){const timerEl=$('timer');if(timerEl)timerEl.style.display='none';}else tick();

function tick() {
  document.querySelectorAll('.disconnect-countdown').forEach(el=>{const deadline=Number(el.dataset.deadline)||0;const seconds=deadline?Math.max(0,Math.ceil((deadline-Date.now())/1000)):60;el.textContent=seconds+'s';});
  const t = $('timer');
  if (S?.room?.localGame) { if(t) t.textContent='Local game · no timer'; return; }
  if (!t || !S || !S.game || S.game.winner != null) { if(t) t.textContent='Game finished'; return; }
  const s = Math.max(0, Math.round((S.game.deadline - Date.now()) / 1000));
  t.textContent = '⏱ ' + s + 's';
  t.classList.toggle('timer-warning', s <= 10 && s > 5);
  t.classList.toggle('timer-critical', s <= 5);
  t.style.color = '';
}
setInterval(tick, 500);

async function loadAdminOverview() {
  if (!S?.me?.isAdmin) return;
  try {
    const [overview, active] = await Promise.all([api('/api/admin/overview'),api('/api/admin/active-rooms')]);
    if (!overview.error) adminOverview=overview; else toast(overview.error);
    if (!active.error) adminActiveRooms=active.rooms||[]; else toast(active.error);
  } catch (_) { toast('Could not load admin overview.'); }
  if(activeScreen==='admin') render();
}
async function loadAdminReports() {
  if (!S?.me?.isAdmin) return;
  adminLoading = true; render();
  const r = await api('/api/admin/reports?status=' + encodeURIComponent(adminStatus));
  adminLoading = false;
  if (r.error) toast(r.error); else adminReports = r.reports || [];
  if (activeScreen === 'admin') render();
}
async function loadAdminUsers() {
  if (!S?.me?.isAdmin) return;
  adminUsersLoading=true; render();
  const r=await api('/api/admin/users'); adminUsersLoading=false;
  if(r.error) toast(r.error); else adminUsers=r.users||[];
  if(activeScreen==='admin') render();
}
function showAdmin() { if (!S?.me?.isAdmin) return; activeScreen = 'admin'; loadAdminOverview(); loadAdminReports(); loadAdminUsers(); render(); }
function adminScreen() {

  if(adminTab==='overview'){
    const stats=[['Players',o.players],['Online now',o.onlinePlayers],['New this week',o.newPlayers],['Games played',o.gamesPlayed],['Active lobbies',o.activeLobbies],['Games running',o.activeGames],['Open reports',o.openReports]];
    const grid=h('div',{class:'settings-grid',style:'grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin:12px 0 18px'});
    stats.forEach(([label,value])=>grid.append(h('div',{class:'panel',style:'padding:15px'},h('div',{class:'muted',style:'font-size:12px'},label),h('div',{style:'font-size:27px;font-weight:850;margin-top:5px'},String(value??'—')))));
    body.append(grid,h('div',{class:'panel'},h('div',{class:'row',style:'justify-content:space-between'},h('h3',{},'Admin shortcuts'),h('button',{class:'alt',onclick:()=>{loadAdminOverview();loadAdminUsers();loadAdminReports();}},'↻ Refresh')),h('div',{class:'row',style:'flex-wrap:wrap'},h('button',{onclick:()=>{adminTab='players';render();}},'Manage players'),h('button',{class:'alt',onclick:()=>{adminTab='reports';render();}},'Review reports'),h('button',{class:'alt',onclick:()=>{adminTab='games';render();}},'Live games'))));

    const found=adminUsers.filter(p=>(p.username+' '+(p.display_name||'')).toLowerCase().includes(adminPlayerSearch.toLowerCase()));

    found.forEach(player=>{

    adminReports.forEach(report=>{
      const actions=h('div',{class:'row',style:'margin-top:8px;flex-wrap:wrap'});
      if(report.status==='open')actions.append(h('button',{class:'alt',onclick:async()=>{const r=await api('/api/admin/reports/update',{reportId:report.id,status:'reviewing'});if(r.error)return toast(r.error);loadAdminReports();}},'Mark reviewing'));

      }
      panel.append(h('div',{style:'padding:12px 0;border-top:1px solid var(--line)'},h('div',{class:'row',style:'justify-content:space-between'},h('strong',{},'#'+report.id+' · '+report.reason.replaceAll('_',' ')),h('span',{class:'muted'},new Date(report.created_at).toLocaleString())),h('div',{},'Reported: @'+report.reported_username+' · By: @'+report.reporter_username),report.details?h('p',{},report.details):null,h('div',{class:'muted'},'Status: '+report.status+(report.moderator_username?' · Reviewed by @'+report.moderator_username:'')),report.resolution?h('div',{class:'muted'},'Note: '+report.resolution:null),actions));

function localLobbyScreen(){
  const count=Number($('localCount')?.value||2);
  const fields=h('div',{class:'settings-grid',style:'gap:10px;margin-top:14px'},[1,2,3,4].map(n=>h('label',{id:'localPlayerField'+n,style:n>count?'display:none':'display:block'},h('small',{class:'muted'},'PLAYER '+n),h('input',{id:'localName'+n,placeholder:'Player '+n,value:n===1?(S.me.displayName||S.me.username):'',maxlength:24,style:'width:100%'}))));
  const panel=h('div',{class:'panel',style:'max-width:620px;margin:24px auto;padding:22px'},
    h('div',{class:'row',style:'justify-content:space-between;align-items:center'},h('div',{},h('div',{class:'eyebrow'},'LOCAL GAME LOBBY'),h('h1',{style:'margin:5px 0'},'Pass & Play')),h('span',{style:'font-size:32px'},'🃏')),
    h('p',{class:'muted'},'Set up your players before starting. Everyone plays on this device; cards are hidden behind a handoff screen between turns.'),
    h('label',{},'Number of players',h('select',{id:'localCount',style:'width:100%;margin-top:6px',onchange:()=>{const n=Number($('localCount').value);for(let i=1;i<=4;i++)$('localPlayerField'+i).style.display=i<=n?'block':'none';}},[2,3,4].map(n=>h('option',{value:n,selected:n===2},n+' players')))),
    fields,

  mount(h('div',{class:'wrap app-shell'},topBar(),panel,bottomNav('home')));
}

function render() {
  if (!token) return authScreen();
  if (!S) return mount(h('div', { class: 'wrap muted' }, 'Connecting…'));
  if (activeScreen === 'profile') return profileScreen();
  if (activeScreen === 'replay') return replayScreen();
  if (activeScreen === 'customize' || activeScreen === 'shop') return shopScreen();
  if (activeScreen === 'social') return socialScreen();
  if (activeScreen === 'admin') return adminScreen();
  if (activeScreen === 'localLobby') return localLobbyScreen();
  // Always show the persistent results lobby before considering any stale game view.
  if (S.room?.result) return roomScreen();
  if (S.game) return gameScreen();
  if (S.room) return roomScreen();
  lobbyScreen();
}

render();
if (token) connect();
loadSeason(); setInterval(() => { if (token && S && !S.room) { if(activeScreen==='home')loadSeason(); } if (token && activeScreen === 'social' && !socialLoading) loadSocial(); }, 15000);
</script>
